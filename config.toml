# Settings #####################################################################

[settings]
lockfile = true


# Bootstrap ####################################################################

# Packages =====================================================================

[bootstrap.packages]
"brew:fish" = "latest"
"brew:starship" = "latest"
"brew:tree" = "latest"

# User =========================================================================

[bootstrap.user]
login_shell = "fish"


# Tools ########################################################################

[tools]

# Stack
node = "latest"
pnpm = "latest"

# Tools
gh = "latest"
fnox = { version = "1.47.0", workflow = "release.yml" }
neovim = "latest"
worktrunk = "latest"
zoxide = "latest"


# # Dotfiles #####################################################################

[dotfiles."~"]
source = "dotfiles"
mode = "symlink-each"
exclude = ["*.tera"]

[dotfiles."~/**/*"]
source = "dotfiles/**/*.tera"
mode = "template"

[dotfiles."~/.config/git/hooks/*"]
permissions = "0755"

[dotfiles."~/.local/bin/*"]
permissions = "0755"